<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mockup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap');
        body { background-color: #030811; color: white; font-family: 'Inter', sans-serif; padding: 2rem; }
        .glass-card { background: rgba(10, 10, 10, 0.65); backdrop-filter: blur(20px); border: 1px solid rgba(233, 193, 118, 0.15); }
        .font-headline-accent { font-family: 'Playfair Display', serif; }
        .text-secondary { color: #C5A059; }
        .bg-secondary { background-color: #C5A059; }
        .text-on-secondary { color: #030811; }
    </style>
</head>
<body>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 max-w-7xl mx-auto">
        <!-- Tour Card 1 -->
        <div class="group relative overflow-hidden rounded-3xl glass-card border-none shadow-xl">
            <div class="aspect-[4/5] relative overflow-hidden">
                <img alt="North Sikkim" class="w-full h-full object-cover" src="https://images.unsplash.com/photo-1626621341517-bbf3d9990a23?q=80&w=800"/>
                <div class="absolute inset-0 bg-gradient-to-t from-[#030811] via-transparent to-transparent"></div>
            </div>
            <div class="absolute bottom-0 p-8 w-full">
                <div class="flex justify-between items-start mb-4">
                    <h3 class="font-headline-accent text-2xl leading-tight italic">North Sikkim Frozen Lake</h3>
                    <span class="text-secondary font-bold">?112,999</span>
                </div>
                <div class="flex items-center gap-6 mb-8 text-gray-300 text-sm">
                    <span class="flex items-center gap-2">8 Days</span>
                    <span class="flex items-center gap-2">Private</span>
                </div>
                <a href="#" class="block text-center w-full bg-secondary text-on-secondary py-4 rounded-xl font-bold text-sm uppercase tracking-widest" style="text-decoration:none;">Plan This Journey</a>
            </div>
        </div>
        
        <!-- Tour Card 2 -->
        <div class="group relative overflow-hidden rounded-3xl glass-card border-none shadow-xl">
            <div class="aspect-[4/5] relative overflow-hidden">
                <img alt="Gangtok Retreat" class="w-full h-full object-cover" src="https://images.unsplash.com/photo-1544365558-35aa4afcf11f?q=80&w=800"/>
                <div class="absolute inset-0 bg-gradient-to-t from-[#030811] via-transparent to-transparent"></div>
            </div>
            <div class="absolute bottom-0 p-8 w-full">
                <div class="flex justify-between items-start mb-4">
                    <h3 class="font-headline-accent text-2xl leading-tight italic">Gangtok Retreat</h3>
                    <span class="text-secondary font-bold">?85,000</span>
                </div>
                <div class="flex items-center gap-6 mb-8 text-gray-300 text-sm">
                    <span class="flex items-center gap-2">5 Days</span>
                    <span class="flex items-center gap-2">Group</span>
                </div>
                <a href="#" class="block text-center w-full bg-secondary text-on-secondary py-4 rounded-xl font-bold text-sm uppercase tracking-widest" style="text-decoration:none;">Plan This Journey</a>
            </div>
        </div>
    </div>
</body>
</html>
