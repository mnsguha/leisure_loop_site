name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy files to staging area via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: "/home/ubuntu/leisure_loop_staging"
          rm: true

      - name: Sync to Live Web Root & Set Permissions
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Use rsync to safely copy from staging to web root
            # We explicitly exclude the live database configuration and user uploads
            sudo rsync -av \
              --exclude '.git' \
              --exclude '.github' \
              --exclude 'config/db.php' \
              --exclude 'public/uploads' \
              /home/ubuntu/leisure_loop_staging/ /var/www/html/
            
            # 2. Reset ownership to the Apache web server user
            sudo chown -R www-data:www-data /var/www/html/
